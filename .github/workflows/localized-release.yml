name: Build localized Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore fork signing key
        env:
          LOCALIZATION_KEYSTORE_B64: ${{ secrets.LOCALIZATION_KEYSTORE_B64 }}
        run: |
          test -n "$LOCALIZATION_KEYSTORE_B64"
          umask 077
          printf '%s' "$LOCALIZATION_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/localization-release.p12"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/localization-release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.LOCALIZATION_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: localization
          RELEASE_KEY_PASSWORD: ${{ secrets.LOCALIZATION_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:ktlintCheck :app:assembleRelease --no-daemon

      - name: Verify Release APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          mapfile -t tools_dirs < <(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V)
          tools_dir=${tools_dirs[-1]}
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk"
          "$tools_dir/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo '::error::Release APK must not be debuggable'
            exit 1
          fi
          grep -E '^(package:|application-label:|locales:)' "$RUNNER_TEMP/apk-badging.txt"
          if ! grep -Eq "^locales:.*'zh-r?CN'" "$RUNNER_TEMP/apk-badging.txt"; then
            echo '::error::Release APK is missing Simplified Chinese resources'
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/biometric-app-lock-zh-CN-release.apk
          (cd dist && sha256sum biometric-app-lock-zh-CN-release.apk > SHA256SUMS.txt)

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: biometric-app-lock-zh-CN-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/localization-release.p12"
